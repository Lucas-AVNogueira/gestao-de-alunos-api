name: Testes da API

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Mocha, SuperTest e Chai
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: segredo-exclusivo-dos-testes-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Executar testes e gerar relatorios
        run: npm run test:ci
      - name: Salvando relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-html-run-${{ github.run_number }}
          path: reports/mochawesome/
          if-no-files-found: error
          retention-days: 30