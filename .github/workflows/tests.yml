name: Testes da API

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Mocha, SuperTest e Chai
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: segredo-exclusivo-dos-testes-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Executar testes
        run: npm test